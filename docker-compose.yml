version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: air-quality-api:latest
    container_name: air_quality_api
    ports:
      - "8000:8000"
    env_file:
      - .env           # copy .env.example → .env and fill in values
    environment:
      DEBUG: "false"
      RATE_LIMIT: "60/minute"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: run tests inside Docker
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder      # has all deps
    image: air-quality-api:test
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install pytest pytest-asyncio --quiet &&
             python -m pytest tests/ -v --tb=short"
    profiles:
      - test               # only runs with: docker compose --profile test up test